<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Note</title>
  <link rel="stylesheet" href="sparkle.css">
  <style>
    :root {
      --sand-50: #fcfcfb;
      --sand-500: #f5f4f0;
      --sand-600: #eeebe3;
      --vast-600: #71716e;
      --vast-950: #1a1a1a;
      --green-600: #059669;
      --green-50: #ecfdf5;
      --dawn-100: #fcf7ff;
      --dawn-600: #d2ace9;
      --pure-white: #ffffff;
      --surface: var(--pure-white);
      --line: var(--sand-600);
      --fg: var(--vast-950);
      --muted: var(--vast-600);
      --soft: var(--sand-500);
      --shadow-sm: 0 1px 3px 0 rgb(26 26 26 / 0.08), 0 1px 2px -1px rgb(26 26 26 / 0.06);
      --shadow-md: 0 4px 12px -2px rgb(26 26 26 / 0.08), 0 2px 4px -2px rgb(26 26 26 / 0.05);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      color: var(--vast-950);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { padding: 14px; }
    .card {
      height: 100%;
      background: var(--sand-50);
      border: 1px solid var(--sand-600);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(26, 26, 26, 0.18), 0 4px 12px rgba(26, 26, 26, 0.08);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--sand-600);
      background: var(--sand-500);
      -webkit-app-region: drag;
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--sand-600);
      background: var(--sand-50);
    }
    button, input, textarea {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      -webkit-app-region: no-drag;
    }
    button { cursor: pointer; }
    #title {
      field-sizing: content;
      width: auto;
      max-width: calc(100% - 40px);
      min-width: 48px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--vast-950);
      padding: 4px 8px;
      border-radius: 8px;
      outline: none;
      transition: background-color .14s ease;
    }
    #title:hover, #title:focus {
      background: #ffffff;
    }
    #close {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--vast-600);
      background: transparent;
      padding: 0;
      cursor: pointer;
      border: 0;
      transition: color .14s ease, background-color .14s ease;
      -webkit-app-region: no-drag;
    }
    #close:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }
    #close svg {
      display: block;
      width: 13px;
      height: 13px;
    }
    textarea {
      resize: none;
      width: 100%;
      height: 100%;
      padding: 16px 18px;
      outline: none;
      font-size: 14.5px;
      line-height: 1.6;
      background: #ffffff;
      color: var(--vast-950);
    }
    textarea::placeholder { color: var(--vast-600); }
    #save, #copy {
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      transition: all .15s ease;
    }
    #save {
      background: var(--vast-950);
      color: var(--sand-50);
      border: 1px solid var(--vast-950);
      box-shadow: 0 1px 2px rgba(26, 26, 26, 0.12);
    }
    #save:hover:not(:disabled) { opacity: 0.92; transform: translateY(-0.5px); }
    #save.saved { background: #16a34a !important; color: #ffffff !important; border-color: #16a34a !important; }
    #copy {
      color: var(--vast-950);
      background: var(--sand-500);
      border: 1px solid var(--sand-600);
    }
    #copy:hover { background: var(--sand-600); }
    #copy.copied { background: var(--sand-600); color: var(--vast-950); border-color: var(--vast-600); }

    /* Deep black voice note icon button in bottom-left */
    .note-voice-btn {
      margin-right: auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: transparent;
      color: #000000;
      border: 0;
      cursor: pointer;
      padding: 0;
      position: relative;
      outline: none;
      transition: transform .14s ease, opacity .14s ease;
    }
    .note-voice-btn:hover {
      transform: scale(1.12);
    }
    .note-voice-btn .icon-active,
    .note-voice-btn .icon-idle,
    .note-voice-btn .icon-busy {
      display: none;
    }
    .note-voice-btn.active .icon-active {
      display: block;
    }
    .note-voice-btn.idle .icon-idle,
    .note-voice-btn.off .icon-idle {
      display: block;
    }
    .note-voice-btn.busy .icon-busy {
      display: block;
    }
    .note-voice-btn.active {
      animation: black-symbol-pulse 1.4s ease-in-out infinite;
    }
    .note-voice-btn.active::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid #000000;
      opacity: 0;
      animation: black-ring-pulse 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    @keyframes black-symbol-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes black-ring-pulse {
      0% { transform: scale(0.7); opacity: 0.85; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    .note-spin {
      width: 16px;
      height: 16px;
      box-sizing: border-box;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-top-color: #000000;
      animation: notespin .7s linear infinite;
    }
    @keyframes notespin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .note-voice-btn.active { animation: none; }
      .note-voice-btn.active::after { animation: none; }
      .note-spin { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <input id="title" value="Note" placeholder="Note title" aria-label="Title">
      <button id="close" type="button" aria-label="Close" title="Close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="3" x2="13" y2="13"></line>
          <line x1="13" y1="3" x2="3" y2="13"></line>
        </svg>
      </button>
    </header>
    <textarea id="body" placeholder="Write or dictate a note..."></textarea>
    <footer>
      <button id="voice" class="note-voice-btn idle" type="button" title="Click to listen again" aria-label="Voice note">
        <svg class="icon-active" width="22" height="22" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.1" stroke="#000000" stroke-width="1.8"></circle><circle cx="8" cy="8" r="2.7" fill="#000000"></circle></svg>
        <svg class="icon-idle" width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.25" y="1.75" width="5.5" height="9" rx="2.75"></rect><path d="M3.75 8.25a5.25 5.25 0 0 0 10.5 0M9 13.5V16"></path></svg>
        <div class="icon-busy note-spin"></div>
      </button>
      <div class="sparkle-host"></div>
      <button id="copy" type="button">Copy</button>
      <button id="save" type="button">Save</button>
    </footer>
  </div>
  <script src="sparkle-client.js"></script>
  <script>
    let currentNote = { id: "", title: "Note", content: "" };
    const voiceButton = document.querySelector("#voice");
    const bodyField = document.querySelector("#body");
    const idlePlaceholder = bodyField.placeholder;
    let voiceState = "idle";
    let voiceWaiters = [];
    let voiceBaseText = "";
    let voiceTranscript = "";

    function setVoiceState(next) {
      voiceState = next;
      voiceButton.className = "note-voice-btn " + (next === "off" ? "idle" : next);
      voiceButton.disabled = next === "busy";
      if (next === "active") {
        voiceButton.title = "Click to stop listening";
        bodyField.placeholder = "Listening...";
      } else if (next === "busy") {
        voiceButton.title = "Transcribing...";
      } else {
        voiceButton.title = "Click to listen again";
        bodyField.placeholder = idlePlaceholder;
      }
      if (next === "idle" || next === "off") {
        const waiters = voiceWaiters;
        voiceWaiters = [];
        waiters.forEach((resolve) => resolve());
      }
    }

    function onVoice(message) {
      if (!message) return;
      if (message.type === "start") {
        voiceBaseText = bodyField.value;
        voiceTranscript = "";
        setVoiceState("active");
      }
      if (message.type === "text") {
        const clean = String(message.text || "").trim();
        if (clean) {
          voiceTranscript = (voiceTranscript ? voiceTranscript + " " : "") + clean;
          const prefix = voiceBaseText ? (/\s$/.test(voiceBaseText) ? voiceBaseText : voiceBaseText + " ") : "";
          bodyField.value = prefix + voiceTranscript;
          bodyField.scrollTop = bodyField.scrollHeight;
          if (window.OpenflowSparkle) window.OpenflowSparkle.sync(bodyField);
          if (document.activeElement === bodyField) {
            bodyField.selectionStart = bodyField.selectionEnd = bodyField.value.length;
          }
        }
      }
      if (message.type === "final") {
        const clean = String(message.text || "").trim();
        if (clean) {
          voiceTranscript = clean;
          const prefix = voiceBaseText ? (/\s$/.test(voiceBaseText) ? voiceBaseText : voiceBaseText + " ") : "";
          bodyField.value = prefix + clean;
          bodyField.scrollTop = bodyField.scrollHeight;
          if (window.OpenflowSparkle) window.OpenflowSparkle.sync(bodyField);
        }
      }
      if (message.type === "stopped" && voiceState === "active") {
        setVoiceState("busy");
      }
      if (message.type === "done") {
        setVoiceState("idle");
      }
    }

    // Stop a running voice note and wait until its last words have landed in the pad.
    function finishVoice() {
      if (voiceState === "idle" || voiceState === "off" || !window.openflow) return Promise.resolve();
      const done = new Promise((resolve) => {
        voiceWaiters.push(resolve);
        setTimeout(resolve, 20000);
      });
      if (voiceState === "active") window.openflow.dispatch("voicenote.stop").catch(() => {});
      return done;
    }

    voiceButton.addEventListener("click", () => {
      if (!window.openflow) return;
      if (voiceState === "active") {
        window.openflow.dispatch("voicenote.stop").catch(() => {});
      } else if (voiceState === "idle" || voiceState === "off") {
        window.openflow.dispatch("voicenote.start").catch(() => {});
      }
    });

    async function onShow(data) {
      if (data && typeof data === "object" && ("title" in data || "content" in data)) {
        currentNote = {
          id: data.id || "",
          title: data.title || "Note",
          content: data.content || "",
        };
      } else {
        const wantedId = data && data.id ? String(data.id) : "";
        if (wantedId && window.openflow) {
          const pads = await window.openflow.dispatch("pads.list");
          const found = (pads || []).find((p) => p.id === wantedId);
          currentNote = found
            ? { id: found.id, title: found.title || "Note", content: found.content || "" }
            : { id: "", title: "Note", content: "" };
        } else {
          currentNote = { id: "", title: "Note", content: "" };
        }
      }
      titleInput.value = currentNote.title;
      bodyField.value = currentNote.content;
      if (window.OpenflowSparkle) window.OpenflowSparkle.sync(bodyField, { reveal: true });
      noteTitleBefore = currentNote.title;
      bodyField.focus();
    }

    function onReset() {
      currentNote = { id: "", title: "Note", content: "" };
      titleInput.value = "Note";
      bodyField.value = "";
      noteTitleBefore = "Note";
      setVoiceState("idle");
    }

    const titleInput = document.querySelector("#title");
    let noteTitleBefore = "";

    titleInput.addEventListener("focus", () => {
      noteTitleBefore = titleInput.value;
    });

    titleInput.addEventListener("keydown", async (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        const val = titleInput.value.trim() || noteTitleBefore || "Note";
        titleInput.value = val;
        noteTitleBefore = val;
        currentNote.title = val;
        if (currentNote.id && window.openflow) {
          await window.openflow.dispatch("pads.save", {
            id: currentNote.id,
            title: val,
            content: bodyField ? bodyField.value : currentNote.content,
          });
        }
        titleInput.blur();
      } else if (event.key === "Escape") {
        event.preventDefault();
        titleInput.value = noteTitleBefore;
        currentNote.title = noteTitleBefore;
        titleInput.blur();
      }
    });

    titleInput.addEventListener("blur", async () => {
      const val = titleInput.value.trim() || noteTitleBefore || "Note";
      titleInput.value = val;
      currentNote.title = val;
      noteTitleBefore = val;
      if (currentNote.id && window.openflow) {
        await window.openflow.dispatch("pads.save", {
          id: currentNote.id,
          title: val,
          content: bodyField ? bodyField.value : currentNote.content,
        });
      }
    });

    document.querySelector("#close").addEventListener("click", () => {
      if (window.openflow) window.openflow.dispatch("note.close");
    });

    document.querySelector("#copy").addEventListener("click", async () => {
      if (!window.openflow) return;
      const btn = document.querySelector("#copy");
      await window.openflow.dispatch("clipboard.copy", { text: document.querySelector("#body").value });
      btn.textContent = "Copied";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "Copy";
        btn.classList.remove("copied");
      }, 1000);
    });

    document.querySelector("#save").addEventListener("click", async () => {
      if (!window.openflow) return;
      const nextTitle = titleInput && titleInput.value.trim() ? titleInput.value.trim() : (currentNote.title || "Note");
      const button = document.querySelector("#save");
      button.disabled = true;
      await finishVoice();
      const nextContent = bodyField ? bodyField.value : "";
      button.textContent = "Saved";
      button.classList.add("saved");
      const saved = await window.openflow.dispatch("pads.save", {
        id: currentNote.id || undefined,
        title: nextTitle,
        content: nextContent,
      });
      currentNote.id = saved.id;
      currentNote.title = nextTitle;
      await new Promise((resolve) => setTimeout(resolve, 500));
      button.disabled = false;
      button.textContent = "Save";
      button.classList.remove("saved");
      await window.openflow.dispatch("note.close");
    });

    let noteSettings = {};
    let sparkle = null;

    function mountSparkle() {
      if (!window.OpenflowSparkle || sparkle) return;
      sparkle = window.OpenflowSparkle.attach({
        host: document.querySelector(".sparkle-host"),
        root: document.querySelector(".card"),
        textarea: bodyField,
        getNote: () => ({
          id: currentNote.id || "",
          title: titleInput.value || currentNote.title || "Note",
          content: bodyField.value,
        }),
        setContent: (text) => {
          bodyField.value = text;
          currentNote.content = text;
          if (window.OpenflowSparkle) window.OpenflowSparkle.sync(bodyField, { reveal: true });
        },
        setNoteId: (id) => { currentNote.id = id; },
        getSettings: () => noteSettings,
        async onSettings(partial) {
          const saved = await window.openflow.dispatch("settings.save", partial);
          if (saved && saved.settings) noteSettings = saved.settings;
          else Object.assign(noteSettings, partial);
        },
        dispatch: (action, payload) => window.openflow.dispatch(action, payload),
      });
    }

    if (window.openflow) {
      window.openflow.on("note-show", async (data) => {
        noteSettings = await window.openflow.dispatch("settings.get");
        await onShow(data);
        mountSparkle();
        if (sparkle) sparkle.onExternalChange();
      });
      window.openflow.on("note-reset", () => {
        if (sparkle) {
          sparkle.close();
          if (sparkle.closeHistory) sparkle.closeHistory();
        }
        onReset();
      });
      window.openflow.on("note-voice", (message) => {
        onVoice(message);
        if (message && message.type === "done" && sparkle) sparkle.onExternalChange();
      });
      window.openflow.dispatch("settings.get").then((settings) => {
        noteSettings = settings || {};
        mountSparkle();
      }).catch(() => {});
      onShow({});
    }
  </script>
</body>
</html>

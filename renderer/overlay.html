<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenFlow</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: visible; background: transparent; color: #fff; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    ::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body { display: flex; align-items: flex-end; justify-content: center; }
    .stack { position: relative; display: grid; justify-items: center; align-items: end; gap: 4px; padding-bottom: 0; }
    .menu { box-sizing: border-box; width: 280px; background: #fcfcfb; color: #1a1a1a; border-radius: 16px; padding: 6px; border: 1px solid #eeebe3; box-shadow: none; }
    .cleanup-menu { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: max-content; padding: 4px; border-radius: 10px; border-color: #e7e4dd; box-shadow: 0 4px 12px rgb(26 26 26 / .07); }
    .cleanup-menu::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; }
    .cleanup-title { padding: 4px 6px 5px; color: #464544; font-size: 10px; font-weight: 700; line-height: 13px; }
    .cleanup-menu .row { cursor: pointer; justify-content: flex-start; gap: 6px; padding: 5px 6px; border-radius: 7px; font-size: 11px; line-height: 14px; white-space: nowrap; }
    .cleanup-menu .mark { display: grid; place-items: center; width: 12px; height: 12px; flex: 0 0 12px; opacity: 0; }
    .cleanup-menu .mark svg { width: 12px; height: 12px; }
    .cleanup-menu button[aria-checked="true"] .mark { width: 12px; height: 12px; margin: 0; border: 0; transform: none; opacity: 1; }
    .cleanup-menu .row:hover, .cleanup-menu .row:focus-visible { background: #f0eee8; }
    .cleanup-menu .row:disabled { opacity: .42; cursor: default; }
    .cleanup-menu .row:focus-visible { outline: 1px solid #c5c0b3; outline-offset: -1px; }
    .pill #cleanup-toggle { width: 28px; height: 30px; margin-right: -3px; margin-left: -2px; border-radius: 9px 999px 999px 9px; color: #bfbfbd; }
    .pill #cleanup-toggle::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: #333; }
    .pill #cleanup-toggle:hover, .pill #cleanup-toggle[aria-expanded="true"] { background: #202020; color: #fff; }
    .pill #cleanup-toggle::after { display: none; }
    #cleanup-toggle svg { transition: transform .16s ease; }
    #cleanup-toggle[aria-expanded="true"] svg { transform: translateY(-1px); }
    #cleanup-toggle.is-cleaned { color: #fff; }
    .pill #cleanup-toggle:focus-visible { outline: 1px solid #bfbfbd; outline-offset: -3px; }
    .row, .menu label { box-sizing: border-box; display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; background: transparent; border: 0; color: inherit; font: inherit; font-size: 13.5px; text-align: left; padding: 8px 10px; border-radius: 10px; }
    .menu button { cursor: default; }
    .mark { width: 14px; height: 14px; }
    button[aria-checked="true"] .mark { border-right: 1.6px solid #1a1a1a; border-bottom: 1.6px solid #1a1a1a; width: 5px; height: 9px; transform: rotate(45deg); margin-right: 4px; }
    .switch { width: 32px; height: 18px; border-radius: 99px; background: #e4e2dc; position: relative; display: inline-block; flex: 0 0 32px; }
    .switch i { position: absolute; width: 14px; height: 14px; border-radius: 99px; background: #fff; top: 2px; left: 2px; }
    input:checked + .switch { background: #000; }
    input:checked + .switch i { left: 16px; }
    .check { position: absolute; opacity: 0; pointer-events: none; }
    #grip { width: 72px; height: 18px; padding: 0; border: 0; border-radius: 999px; background: #000; position: relative; cursor: pointer; display: block; box-shadow: none; clip-path: inset(2px 0 2px 0); }
    #grip span { position: absolute; top: 5px; left: 18px; width: 36px; height: 2px; border-radius: 2px; background: #fff; display: block; }
    .pill { position: relative; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 4px; width: auto; min-width: 44px; height: 36px; padding: 3px 6px; background: #000; color: #fff; border-radius: 999px; box-shadow: none; }
    .pill button { position: relative; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer; transition: background-color .14s ease, transform .14s ease; }
    .pill button:hover { background: #1f1f1f; }
    .pill button[aria-pressed="true"] { background: #1f1f1f; }
    .pill button::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(3px);
      background: #000;
      color: #fff;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      box-shadow: none;
      border: 0;
      transition: opacity .14s ease, transform .14s ease;
    }
    .pill button:hover::after, .pill button:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    /* Voice note: a dark slider track that slides out to the left of the mic. */
    .voice-group { position: relative; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .vtrack { position: absolute; z-index: 0; top: 0; right: 0; width: 30px; height: 30px; box-sizing: border-box; border-radius: 999px; background: #000000; border: none; opacity: 0; pointer-events: none; transition: width .22s cubic-bezier(.2,.8,.2,1), opacity .16s ease; }
    .pill.voice-open .vtrack { width: 62px; opacity: 1; pointer-events: auto; }
    #mic { position: relative; z-index: 1; }
    .pill.voice-open #mic { background: #1f1f1f; box-shadow: none; }

    #vnote { position: absolute; z-index: 1; top: 0; left: -32px; width: 30px; height: 30px; border-radius: 999px; background: #000000; opacity: 0; pointer-events: none; transform: translateX(16px) scale(.7); transition: opacity .16s ease, transform .22s cubic-bezier(.2,.8,.2,1), background-color .14s ease; }
    .pill.voice-open #vnote { opacity: 1; pointer-events: auto; transform: translateX(0) scale(1); }
    #vnote:hover { background: #1f1f1f; }
    #vnote::after { left: -6px; transform: translateY(3px); }
    #vnote:hover::after, #vnote:focus-visible::after { transform: translateY(0); }

    /* Floating bubble appearance states */
    body[data-bubble-style="dimmed"] #grip { opacity: 0.35; filter: grayscale(1); background: #555555; transition: opacity .18s ease, filter .18s ease, background-color .18s ease; }
    body[data-bubble-style="dimmed"] #grip:hover, body[data-bubble-style="dimmed"][data-near="true"] #grip { opacity: 0.85; filter: grayscale(0); background: #000000; }
    body[data-bubble-style="dimmed"] .pill { opacity: 0.45; filter: grayscale(0.8); transition: opacity .18s ease, filter .18s ease; }
    body[data-bubble-style="dimmed"]:hover .pill,
    body[data-bubble-style="dimmed"][data-near="true"] .pill,
    body[data-bubble-style="dimmed"][data-mode="listening"] .pill,
    body[data-bubble-style="dimmed"][data-mode="working"] .pill { opacity: 1; filter: grayscale(0); }
    body[data-bubble-style="hidden"] #grip { display: none !important; }
    body[data-bubble-style="hidden"]:not([data-mode="listening"]):not([data-mode="working"]) { opacity: 0 !important; pointer-events: none !important; }









    .status { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    body[data-mode="listening"] .pill, body[data-mode="working"] .pill { width: 72px; height: 18px; padding: 0 16px; }
    body[data-mode="listening"] .pill button, body[data-mode="working"] .pill button, body[data-mode="listening"] .voice-group, body[data-mode="working"] .voice-group { display: none !important; }
    body[data-mode="listening"] #status, body[data-mode="working"] #status { display: flex !important; }
    .spin { width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.28); border-top-color: #fff; animation: ofspin .7s linear infinite; }
    .ai-indicator { width: 16px; height: 16px; display: grid; place-items: center; color: #faf9f7; }
    .ai-indicator svg { width: 14px; height: 14px; overflow: visible; animation: ai-float 1.9s cubic-bezier(.45,0,.55,1) infinite; }
    .ai-indicator .ai-main { transform-origin: 12px 12px; animation: ai-breathe 1.9s ease-in-out infinite; }
    .ai-indicator .ai-small { animation: ai-glint 1.9s ease-in-out infinite; }
    .ai-indicator .ai-small:last-child { animation-delay: -.65s; }
    @keyframes ai-float { 0%, 100% { transform: translateY(1px); } 50% { transform: translateY(-1px); } }
    @keyframes ai-breathe { 0%, 100% { opacity: .85; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes ai-glint { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes ofspin { to { transform: rotate(360deg); } }
    .eq { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 14px; }
    .eq i { width: 2px; height: 3px; background: #fff; display: block; border-radius: 2px; }
    body.speaking .eq i { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    @media (prefers-reduced-motion: reduce) {
      .eq i { transition: none; }
      .spin { animation: none; border-color: #fff; }
      .ai-indicator svg, .ai-indicator g { animation: none; opacity: 1; transform: none; }
    }
    svg { display: block; }
  </style>
</head>
<body data-mode="idle" data-near="false">
  <div class="stack">

      <button class="row" type="button" role="menuitemradio" data-cleanup-mode="polished" aria-checked="false"><span class="cleanup-label">Polish dictation</span><span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8 3 3 6-6"/></svg></span></button>

        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 9.25 3.5-3.5 3.5 3.5"/></svg>

  <script>
    const menu = document.querySelector("#menu");
    const cleanupToggle = document.querySelector("#cleanup-toggle");
    let cleanupEnabled = false;
    let cleanupMode = "raw";
    let processingCleanupMode = "raw";
    let textModelReady = false;
    let cleanupCloseTimer = 0;
    const note = document.querySelector("#note");
    const tune = document.querySelector("#tune");
    const shot = document.querySelector("#shot");
    const status = document.querySelector("#status");
    const mic = document.querySelector("#mic");
    const grip = document.querySelector("#grip");
    const pill = document.querySelector("#pill");
    const vnote = document.querySelector("#vnote");
    const vtrack = document.querySelector("#vtrack");
    const voiceGroup = document.querySelector("#voice-group");
    let floatingBubble = "active";
    let bubbleElements = ["voice", "note", "tune", "shot"];
    let commandsList = [];
    const commandElements = new Map();
    let voiceNoteButton = true;
    let voiceNext = false;
    let voiceSession = false;
    let voiceCloseTimer = 0;
    let mode = "idle";
    let near = false;
    let menuOpen = false;
    let fromSymbol = false;
    let settleNear = false;
    let armed = false;
    let uiGen = 0;
    let micRepaired = false;
    let capture = null;
    let activeBucket = null;
    let closingBucket = null;
    let micQueue = Promise.resolve();
    let placedW = 0;
    let placedH = 0;
    let placedMenuOpen = false;
    const clips = {
      start: new Audio("sounds/listen-start.wav"),
      done: new Audio("sounds/done.wav"),
      error: new Audio("sounds/error.wav"),
    };

    function play(name) {
      const clip = clips[name];
      if (!clip) return;
      clip.currentTime = 0;
      clip.play().catch(() => {});
    }

    function layout() {
      let width = 72;
      let height = 18;
      if (mode !== "listening" && mode !== "working" && near) {
        const activeIds = Array.isArray(bubbleElements) && bubbleElements.length ? bubbleElements : ["voice", "note", "tune", "shot"];
        const visibleCount = activeIds.filter((id) => {
          if (["voice", "note", "tune", "shot"].includes(id)) return true;
          return id.startsWith("cmd:") && commandsList.some((c) => c.id === id.slice(4));
        }).length;
        const expandedWidth = Math.max(280, Math.min(640, visibleCount * 36 + 72 + (cleanupEnabled ? 180 : 0)));
        width = Math.max(280, expandedWidth);
        // Reserve the menu's transparent space while expanded. Opening or
        // selecting a mode must not resize and hide the entire native window.
        height = cleanupEnabled ? 176 : 78;
      }
      document.body.dataset.mode = mode;
      document.body.dataset.near = near ? "true" : "false";
      const menuChanged = menuOpen !== placedMenuOpen;
      placedMenuOpen = menuOpen;
      if (width === placedW && height === placedH) {
        if (menuChanged && window.openflow) window.openflow.dispatch("bar.mode", { menuOpen });
        return;
      }
      placedW = width;
      placedH = height;
      resizeHidden(width, height);
    }

    // Resizing a transparent window on Windows briefly presents the previous frame
    // anchored at the top-left of the new bounds, which flashes a misplaced piece of
    // the bar. Hide the content, wait until the hidden frame is on screen, resize,
    // and only reveal once the window really has the new size and has been repainted.
    let resizeGen = 0;
    let revealTimer = 0;
    function nextFrames(count, done) {
      if (count <= 0) { done(); return; }
      requestAnimationFrame(() => nextFrames(count - 1, done));
    }
    function reveal(gen) {
      if (gen !== resizeGen) return;
      clearTimeout(revealTimer);
      window.removeEventListener("resize", onResize);
      document.body.style.visibility = "";
    }
    function sizedTo(width, height) {
      // Fractional display scaling can round the CSS viewport by a pixel.
      return Math.abs(window.innerWidth - width) <= 2 && Math.abs(window.innerHeight - height) <= 2;
    }
    function onResize() {
      const gen = resizeGen;
      if (!sizedTo(placedW, placedH)) return;
      nextFrames(2, () => reveal(gen));
    }
    function resizeHidden(width, height) {
      const gen = ++resizeGen;
      document.body.style.visibility = "hidden";
      clearTimeout(revealTimer);
      revealTimer = setTimeout(() => reveal(gen), 300);
      window.removeEventListener("resize", onResize);
      let sent = false;
      const send = () => {
        if (sent || gen !== resizeGen) return;
        sent = true;
        window.addEventListener("resize", onResize);
        if (window.openflow) window.openflow.dispatch("bar.mode", { width, height, menuOpen });
        if (sizedTo(width, height)) onResize();
      };
      // rAF may stall while the window is hidden; never let that block the resize.
      setTimeout(send, 60);
      nextFrames(2, send);
    }

    const COMMAND_ICON_SVGS = {
      terminal: '<rect x="2.5" y="2.5" width="13" height="13" rx="2.5"></rect><path d="M5.5 6.5l2.75 2.5-2.75 2.5M10 11.5h2.5"></path>',
      bolt: '<path d="M9.5 2L4 10h4.5l-1 6 6-8H9l.5-6z"></path>',
      gear: '<circle cx="9" cy="9" r="2.75"></circle><path d="M9 2.25v1.75M9 14v1.75M2.25 9H4M14 9h1.75M4.22 4.22l1.24 1.24M12.54 12.54l1.24 1.24M4.22 13.78l1.24-1.24M12.54 5.46l1.24-1.24"></path>',
      rocket: '<path d="M9 2.5c2.5 1.5 4 4.5 4 7.5l-2 1.5-2-2-2 2-2-1.5c0-3 1.5-6 4-7.5z"></path><path d="M5 11.5L3 14l3.5-.5M13 11.5L15 14l-3.5-.5M9 11.5v4"></path>',
      bug: '<rect x="6" y="5.5" width="6" height="8" rx="3"></rect><path d="M9 5.5V3.5M6.5 3.5 8 5M11.5 3.5 10 5M4 8h2M12 8h2M4 11.5h2M12 11.5h2"></path>',
      trash: '<path d="M3.5 5h11M7 5V3.5c0-.6.4-1 1-1h2c.6 0 1 .4 1 1V5M5.5 5l.5 9c0 .6.4 1 1 1h4c.6 0 1-.4 1-1l.5-9"></path>',
      refresh: '<path d="M3.5 8.5A5.5 5.5 0 0 1 13.5 5l1.5-1.5M15 3.5V7h-3.5"></path><path d="M14.5 9.5A5.5 5.5 0 0 1 4.5 13L3 14.5M3 14.5V11h3.5"></path>',
      shield: '<path d="M9 2.5l5.5 2.5v4.5c0 3.5-3.5 5.8-5.5 6.5-2-0.7-5.5-3-5.5-6.5V5L9 2.5z"></path>',
      globe: '<circle cx="9" cy="9" r="6.5"></circle><path d="M2.5 9h13M9 2.5a10 10 0 0 1 2.5 6.5 10 10 0 0 1-2.5 6.5A10 10 0 0 1 6.5 9 10 10 0 0 1 9 2.5z"></path>',
      database: '<ellipse cx="9" cy="4.5" rx="5.5" ry="2"></ellipse><path d="M3.5 4.5v4.5c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4.5"></path><path d="M3.5 9v4.5c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V9"></path>',
      server: '<rect x="3" y="3" width="12" height="4.5" rx="1.5"></rect><rect x="3" y="10.5" width="12" height="4.5" rx="1.5"></rect><circle cx="5.5" cy="5.25" r=".75" fill="currentColor"></circle><circle cx="5.5" cy="12.75" r=".75" fill="currentColor"></circle>',
      folder: '<path d="M2.5 4.5c0-.6.4-1 1-1h3.2l1.6 1.8H14.5c.6 0 1 .4 1 1v7c0 .6-.4 1-1 1h-11c-.6 0-1-.4-1-1v-8.8z"></path>',
      code: '<path d="M6 5.5L2.5 9 6 12.5M12 5.5l3.5 3.5-3.5 3.5M10.5 4l-3 10"></path>',
      cpu: '<rect x="5" y="5" width="8" height="8" rx="1.8"></rect><path d="M7 5V2.5M11 5V2.5M7 15.5V13M11 15.5V13M5 7H2.5M5 11H2.5M15.5 7H13M15.5 11H13"></path>',
      robot: '<rect x="4" y="5" width="10" height="9" rx="2.5"></rect><path d="M9 2.5V5M2.5 9.5H4M14 9.5h1.5"></path><circle cx="6.5" cy="8.5" r=".8" fill="currentColor"></circle><circle cx="11.5" cy="8.5" r=".8" fill="currentColor"></circle><path d="M6.5 11.5h5"></path>',
      wrench: '<path d="M14.5 3.5a3.5 3.5 0 0 0-4.5.5L4 10l-.5 4.5 4.5-.5 6-6a3.5 3.5 0 0 0 .5-4.5z"></path>',
      bell: '<path d="M9 2.5a3.5 3.5 0 0 0-3.5 3.5c0 3-1.5 4.5-1.5 4.5h10s-1.5-1.5-1.5-4.5a3.5 3.5 0 0 0-3.5-3.5z"></path><path d="M7.5 14a1.8 1.8 0 0 0 3 0"></path>',
      power: '<path d="M9 2.5v5M5 4.5a6 6 0 1 0 8 0"></path>',
      sparkles: '<path d="M9 2.5l1.2 3.3L13.5 7 10.2 8.2 9 11.5 7.8 8.2 4.5 7l3.3-1.2L9 2.5z"></path><path d="M13.5 12l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6.6-1.4z"></path>',
      play: '<polygon points="5.5,3.5 14,9 5.5,14.5" fill="none" stroke="currentColor"></polygon>'
    };

    function getCommandSvg(iconId) {
      const inner = COMMAND_ICON_SVGS[iconId] || COMMAND_ICON_SVGS.terminal;
      return `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    }

    function getOrCreateCommandButton(cmdId) {
      const cmd = commandsList.find((c) => c.id === cmdId);
      const name = cmd ? cmd.name : "Command";
      const icon = cmd && cmd.icon ? cmd.icon : "terminal";
      const iconSvg = getCommandSvg(icon);
      if (commandElements.has(cmdId)) {
        const btn = commandElements.get(cmdId);
        btn.setAttribute("aria-label", name);
        btn.setAttribute("data-tooltip", name);
        if (btn.dataset.icon !== icon) {
          btn.dataset.icon = icon;
          btn.innerHTML = iconSvg;
        }
        return btn;
      }
      const btn = document.createElement("button");
      btn.id = `cmd-${cmdId}`;
      btn.type = "button";
      btn.className = "cmd-bubble-btn";
      btn.setAttribute("aria-label", name);
      btn.setAttribute("data-tooltip", name);
      btn.dataset.icon = icon;
      btn.innerHTML = iconSvg;
      btn.addEventListener("click", (event) => {
        event.stopPropagation();
        if (window.openflow) window.openflow.dispatch("commands.run", { id: cmdId });
      });
      commandElements.set(cmdId, btn);
      return btn;
    }

    function applyBubbleConfig() {
      document.body.dataset.bubbleStyle = floatingBubble;
      const elemMap = {
        voice: voiceGroup,
        note: note,
        tune: tune,
        shot: shot,
      };
      const activeIds = Array.isArray(bubbleElements) && bubbleElements.length ? bubbleElements : ["voice", "note", "tune", "shot"];
      Object.keys(elemMap).forEach((id) => {
        const el = elemMap[id];
        if (!el) return;
        if (!activeIds.includes(id)) {
          el.hidden = true;
        }
      });
      commandElements.forEach((btn, cmdId) => {
        if (!activeIds.includes(`cmd:${cmdId}`) || !commandsList.some((c) => c.id === cmdId)) {
          btn.remove();
          commandElements.delete(cmdId);
        }
      });
      let nextElement = cleanupToggle;
      [...activeIds].reverse().forEach((id) => {
        let el = null;
        if (elemMap[id]) el = elemMap[id];
        else if (id.startsWith("cmd:")) {
          const cmdId = id.slice(4);
          if (commandsList.some((c) => c.id === cmdId)) {
            el = getOrCreateCommandButton(cmdId);
          }
        }
        if (el && pill && status) {
          if (el.nextElementSibling !== nextElement) pill.insertBefore(el, nextElement);
          nextElement = el;
        }
      });
      paint();
    }

    function paint() {
      const busy = mode === "listening" || mode === "working";
      const open = near && !busy;
      const isHidden = floatingBubble === "hidden";
      grip.hidden = isHidden || open || busy;
      pill.hidden = !open && !busy;

      const activeIds = Array.isArray(bubbleElements) && bubbleElements.length ? bubbleElements : ["voice", "note", "tune", "shot"];
      const elemMap = {
        voice: voiceGroup,
        note: note,
        tune: tune,
        shot: shot,
      };
      Object.keys(elemMap).forEach((id) => {
        const el = elemMap[id];
        if (!el) return;
        const isActive = activeIds.includes(id);
        el.hidden = !open || !isActive;
      });

      commandElements.forEach((btn, cmdId) => {
        const isActive = activeIds.includes(`cmd:${cmdId}`);
        btn.hidden = !open || !isActive;
      });

      const voiceActive = activeIds.includes("voice");
      mic.hidden = !open || !voiceActive;
      vnote.hidden = !open || !voiceActive || !voiceNoteButton;
      vtrack.hidden = !open || !voiceActive || !voiceNoteButton;
      if (!open || !voiceActive || !voiceNoteButton) setVoiceOpen(false);

      status.hidden = !busy;
      document.querySelector(".eq").hidden = mode !== "listening";
      const aiProcessing = mode === "working" && processingCleanupMode !== "raw" && cleanupEnabled && textModelReady;
      document.querySelector("#spin").hidden = mode !== "working" || aiProcessing;
      document.querySelector("#ai-working").hidden = !aiProcessing;
      if (!cleanupEnabled || !open) menuOpen = false;
      cleanupToggle.hidden = !open || !cleanupEnabled;
      cleanupToggle.setAttribute("aria-expanded", String(menuOpen));
      cleanupToggle.classList.toggle("is-cleaned", cleanupMode !== "raw");
      cleanupToggle.dataset.tooltip = cleanupMode === "polished" ? "Polish dictation" : cleanupMode === "fillers" ? "Improve dictation" : "Original";
      menu.hidden = !open || !menuOpen;
      mic.setAttribute("aria-pressed", mode === "listening" ? "true" : "false");
      document.querySelectorAll("[data-cleanup-mode]").forEach(button => {
        button.setAttribute("aria-checked", String(button.dataset.cleanupMode === cleanupMode));
        button.disabled = button.dataset.cleanupMode !== "raw" && !textModelReady;
        button.title = button.disabled ? "Add an API key in Settings" : "";
      });
      if (open && cleanupEnabled) {
        const arrow = cleanupToggle.getBoundingClientRect();
        const stack = document.querySelector(".stack").getBoundingClientRect();
        menu.style.left = `${arrow.left + arrow.width / 2 - stack.left}px`;
      }
      layout();
    }

    function enqueueMic(work) {
      const run = micQueue.then(work, work);
      micQueue = run.then(() => {}, () => {});
      return run;
    }

    function mergeFrames(frames) {
      let total = 0;
      for (const frame of frames) total += frame.length;
      const merged = new Float32Array(total);
      let offset = 0;
      for (const frame of frames) {
        merged.set(frame, offset);
        offset += frame.length;
      }
      return merged;
    }

    function markSpeaking(frame) {
      let sum = 0;
      let count = 0;
      const step = Math.max(1, Math.floor(frame.length / 64));
      for (let index = 0; index < frame.length; index += step) {
        const sample = frame[index];
        sum += sample * sample;
        count += 1;
      }
      document.body.classList.toggle("speaking", count > 0 && Math.sqrt(sum / count) > 0.045);
    }

    function streamLive(current) {
      return Boolean(current && current.stream && current.stream.getTracks().some((track) => track.readyState === "live"));
    }

    function releaseCapture() {
      const current = capture;
      if (!current) return;
      capture = null;
      if (current.meter) cancelAnimationFrame(current.meter);
      try {
        if (current.recorder && current.recorder.state === "recording") current.recorder.stop();
      } catch (_error) {}
      try { if (current.worklet) current.worklet.disconnect(); } catch (_error) {}
      try { if (current.silent) current.silent.disconnect(); } catch (_error) {}
      try { if (current.source) current.source.disconnect(); } catch (_error) {}
      try { if (current.context) current.context.close(); } catch (_error) {}
      current.stream.getTracks().forEach((track) => track.stop());
    }

    async function acquireStream() {
      const strict = {
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1,
        },
      };
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (first) {
        try {
          return await navigator.mediaDevices.getUserMedia(strict);
        } catch (_second) {
          if (!micRepaired && window.openflow) {
            micRepaired = true;
            const repaired = await window.openflow.dispatch("mic.repair").catch(() => null);
            if (repaired && repaired.changed) {
              try {
                return await navigator.mediaDevices.getUserMedia({ audio: true });
              } catch (_again) {
                return navigator.mediaDevices.getUserMedia(strict);
              }
            }
          }
          throw first;
        }
      }
    }

    async function loadWorklet(context) {
      try {
        await context.audioWorklet.addModule("capture-worklet.js");
        return;
      } catch (_error) {}
      const response = await fetch("capture-worklet.js");
      if (!response.ok) throw new Error("Capture worklet missing");
      const sourceText = await response.text();
      const url = URL.createObjectURL(new Blob([sourceText], { type: "text/javascript" }));
      try {
        await context.audioWorklet.addModule(url);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function connectGraph() {
      if (!capture || !capture.source || !capture.context) return;
      try { capture.source.disconnect(); } catch (_error) {}
      if (capture.worklet) {
        try { capture.worklet.disconnect(); } catch (_error) {}
      }
      if (capture.silent) {
        try { capture.silent.disconnect(); } catch (_error) {}
      }
      capture.source.connect(capture.analyser);
      capture.analyser.connect(capture.silent);
      capture.silent.connect(capture.context.destination);
      if (capture.worklet) {
        capture.source.connect(capture.worklet);
        capture.worklet.connect(capture.silent);
      }
      watchAnalyser();
    }

    function disconnectGraph() {
      if (!capture || capture.mediaFallback) return;
      try { capture.worklet.disconnect(); } catch (_error) {}
      try { capture.silent.disconnect(); } catch (_error) {}
      try { capture.source.disconnect(); } catch (_error) {}
    }

    function onWorkletMessage(event) {
      const data = event.data;
      if (data === "done") {
        if (capture && capture.onDone) {
          const done = capture.onDone;
          capture.onDone = null;
          done();
        }
        return;
      }
      if (!data || typeof data === "string" || typeof data.length !== "number") return;
      pushFrame(data);
    }

    function pushFrame(frame) {
      const target = closingBucket || activeBucket;
      if (!target) return;
      const copy = frame instanceof Float32Array ? frame : Float32Array.from(frame);
      target.frames.push(copy);
      target.samples += copy.length;
      if (armed && target === activeBucket) markSpeaking(copy);
      if (target.voice && target === activeBucket) {
        // Voice notes stream text live: cut a chunk at the next short pause (or a hard cap)
        // so every phrase is transcribed while the user keeps talking.
        let sum = 0;
        for (let index = 0; index < copy.length; index += 4) sum += copy[index] * copy[index];
        const rms = Math.sqrt(sum / Math.max(1, Math.ceil(copy.length / 4)));
        target.quiet = rms < 0.012 ? (target.quiet || 0) + copy.length : 0;
        const rate = target.rate || 48000;
        if ((target.samples >= rate * 0.9 && target.quiet >= rate * 0.28) || target.samples >= rate * 3.2) {
          target.quiet = 0;
          flushBucket(target);
        }
        return;
      }
      const limit = capture && capture.flushAt ? capture.flushAt : 0;
      if (!limit || target !== activeBucket || target.samples < limit) return;
      flushBucket(target);
    }

    function flushBucket(target) {
      const frames = target.frames;
      target.frames = [];
      target.samples = 0;
      target.send = target.send.then(async () => {
        if (target.error) return;
        try {
          await ship(target, frames);
        } catch (error) {
          target.error = error instanceof Error ? error : new Error(String(error));
        }
      });
    }

    async function ship(bucket, frames) {
      if (!frames || !frames.length || !window.openflow) return;
      const packed = await window.openflow.pack(mergeFrames(frames), bucket.rate, Boolean(bucket.token) || Boolean(bucket.voice));
      if (!bucket.token && !bucket.voice && (!packed || !packed.audible)) return;
      if (!bucket.token) {
        const session = await window.openflow.dispatch("speech.session", { voice: Boolean(bucket.voice) });
        bucket.token = session && session.token;
        if (!bucket.token) throw new Error("Recording session expired.");
      }
      for (const slice of (packed && packed.slices) || []) {
        const size = slice.byteLength || slice.length || 0;
        if (size > 24 * 1024 * 1024) throw new Error("Recording is too large.");
        const accepted = await window.openflow.dispatch("speech.part", {
          token: bucket.token,
          audio: slice,
          mime: "audio/wav",
          filename: "recording.wav",
        });
        if (accepted === false) return;
      }
    }

    function watchAnalyser() {
      if (!capture || !capture.analyser) return;
      const data = new Uint8Array(capture.analyser.fftSize);
      const tick = () => {
        if (!armed || !capture || !capture.analyser) return;
        capture.analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (let index = 0; index < data.length; index += 1) {
          const sample = (data[index] - 128) / 128;
          sum += sample * sample;
        }
        const level = Math.sqrt(sum / data.length);
        const hot = level > 0.02;
        document.body.classList.toggle("speaking", hot);
        const bars = document.querySelectorAll(".eq i");
        bars.forEach((bar, index) => {
          const shape = 0.72 + (index % 2) * 0.28;
          const px = hot ? Math.max(4, Math.min(14, 3 + level * 110 * shape)) : 3;
          bar.style.height = `${px}px`;
        });
        capture.meter = requestAnimationFrame(tick);
      };
      capture.meter = requestAnimationFrame(tick);
    }

    function startRecorder(bucket) {
      const mime = typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus"
        : "";
      const recorder = mime ? new MediaRecorder(capture.stream, { mimeType: mime }) : new MediaRecorder(capture.stream);
      bucket.mime = recorder.mimeType || mime || "audio/webm";
      bucket.blobs = [];
      let bytes = 0;
      recorder.addEventListener("dataavailable", (event) => {
        if (!event.data || !event.data.size) return;
        bytes += event.data.size;
        bucket.blobs.push(event.data);
        if (bytes > 24 * 1024 * 1024) bucket.error = new Error("Recording is too large.");
      });
      recorder.start(1000);
      capture.recorder = recorder;
    }

    async function ensureCapture() {
      if (streamLive(capture)) {
        if (capture.context && capture.context.state === "suspended") await capture.context.resume().catch(() => {});
        return capture;
      }
      releaseCapture();
      const stream = await acquireStream();
      const context = new AudioContext({ latencyHint: "interactive" });
      if (context.state === "suspended") await context.resume().catch(() => {});
      const rate = context.sampleRate || 48000;
      const flushAt = window.openflow ? await window.openflow.flushSampleCount(rate) : 0;
      const source = context.createMediaStreamSource(stream);
      const analyser = context.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.35;
      const silent = context.createGain();
      silent.gain.value = 0;
      const next = {
        stream,
        context,
        source,
        analyser,
        silent,
        rate,
        flushAt: flushAt || Math.floor((15 * 1024 * 1024 / 2) * rate / 16000),
        onDone: null,
        meter: 0,
      };
      stream.getTracks().forEach((track) => {
        track.addEventListener("ended", () => {
          if (capture === next) releaseCapture();
        });
      });
      try {
        await loadWorklet(context);
        const node = new AudioWorkletNode(context, "openflow-capture");
        next.worklet = node;
        node.port.onmessage = onWorkletMessage;
      } catch (_error) {
        next.worklet = null;
      }
      capture = next;
      return next;
    }

    function settle() {
      mode = "idle";
      near = settleNear;
      menuOpen = false;
      document.body.classList.remove("speaking");
      paint();
    }

    function finishUi(bucket, result) {
      if (!bucket || bucket.gen !== uiGen || armed) return;
      if (result && result.text) play("done");
      settle();
    }

    function failUi(gen) {
      if (gen !== uiGen || armed) return;
      play("error");
      settle();
    }

    async function transcribe(bucket) {
      await bucket.send;
      if (bucket.error) throw bucket.error;
      if (bucket.frames.length) {
        const frames = bucket.frames;
        bucket.frames = [];
        bucket.samples = 0;
        await ship(bucket, frames);
      }
      if (!bucket.token && bucket.blobs && bucket.blobs.length) {
        const blob = new Blob(bucket.blobs, { type: "audio/webm" });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        if (bytes.length >= 200) {
          if (bytes.length > 24 * 1024 * 1024) throw new Error("Recording is too large.");
          const session = await window.openflow.dispatch("speech.session", { voice: Boolean(bucket.voice) });
          bucket.token = session && session.token;
          if (!bucket.token) throw new Error("Recording session expired.");
          await window.openflow.dispatch("speech.part", {
            token: bucket.token,
            audio: bytes,
            mime: "audio/webm",
            filename: "recording.webm",
          });
        }
      }
      if (bucket.error) throw bucket.error;
      if (!bucket.token) {
        finishUi(bucket, { empty: true });
        return;
      }
      const result = await window.openflow.dispatch("speech.finish", {
        token: bucket.token,
        durationMs: Math.max(0, Date.now() - bucket.startedAt),
        appName: "",
      });
      finishUi(bucket, result || { empty: true });
    }

    function resetBars() {
      document.querySelectorAll(".eq i").forEach((bar) => { bar.style.height = "3px"; });
    }

    async function collectStopped() {
      if (!capture) return;
      const pending = [];
      if (capture.recorder && capture.recorder.state === "recording") {
        pending.push(new Promise((resolve) => {
          capture.recorder.addEventListener("stop", () => resolve(), { once: true });
          try { capture.recorder.requestData(); } catch (_error) {}
          try { capture.recorder.stop(); } catch (_error) { resolve(); }
        }));
      }
      if (capture.worklet) {
        if (capture.context && capture.context.state === "suspended") await capture.context.resume().catch(() => {});
        pending.push(new Promise((resolve) => {
          const timer = setTimeout(() => {
            if (capture) capture.onDone = null;
            resolve();
          }, 500);
          capture.onDone = () => {
            clearTimeout(timer);
            resolve();
          };
          capture.worklet.port.postMessage("stop");
        }));
      }
      await Promise.all(pending);
      if (capture && capture.meter) cancelAnimationFrame(capture.meter);
      if (capture) capture.meter = 0;
      disconnectGraph();
    }

    async function start() {
      if (armed) return;
      const voice = voiceNext;
      voiceNext = false;
      voiceSession = voice;
      const gen = ++uiGen;
      armed = true;
      mode = "listening";
      menuOpen = false;
      play("start");
      paint();
      try {
        await enqueueMic(async () => {
          if (!armed || gen !== uiGen) return;
          await ensureCapture();
          if (!armed || gen !== uiGen) return;
          if (capture.context && capture.context.state === "suspended") await capture.context.resume().catch(() => {});
          const bucket = {
            gen,
            frames: [],
            samples: 0,
            blobs: [],
            mime: "audio/webm",
            token: "",
            rate: capture.rate,
            send: Promise.resolve(),
            error: null,
            startedAt: Date.now(),
            voice,
            quiet: 0,
          };
          activeBucket = bucket;
          connectGraph();
          startRecorder(bucket);
          if (capture.worklet) capture.worklet.port.postMessage("start");
        });
      } catch (_error) {
        if (gen !== uiGen) return;
        armed = false;
        activeBucket = null;
        closingBucket = null;
        mode = "idle";
        document.body.classList.remove("speaking");
        play("error");
        paint();
        if (voice && window.openflow) window.openflow.dispatch("voicenote.done", { error: "Microphone access blocked" }).catch(() => {});
        if (window.openflow) {
          window.openflow.dispatch("notifications.add", {
            title: "Microphone",
            body: "Microphone access blocked",
          }).catch(() => {});
        }
      }
    }

    function stop() {
      if (!armed) return;
      const gen = uiGen;
      settleNear = fromSymbol;
      fromSymbol = false;
      armed = false;
      processingCleanupMode = !voiceSession && cleanupEnabled && textModelReady ? cleanupMode : "raw";
      mode = "working";
      menuOpen = false;
      document.body.classList.remove("speaking");
      resetBars();
      paint();
      let voice = voiceSession;
      voiceSession = false;
      let voiceError = "";
      enqueueMic(async () => {
        const bucket = activeBucket;
        activeBucket = null;
        closingBucket = bucket;
        if (!bucket) return null;
        await collectStopped();
        closingBucket = null;
        return bucket;
      }).then((bucket) => {
        if (!bucket) {
          if (gen === uiGen && !armed) settle();
          return null;
        }
        return transcribe(bucket);
      }).catch((error) => {
        voiceError = (error && error.message) || "Transcription failed";
        failUi(gen);
      }).finally(() => {
        if (voice && window.openflow) window.openflow.dispatch("voicenote.done", { error: voiceError }).catch(() => {});
      });
    }

    function applyState(state) {
      const next = state && state.mode;
      if (armed || mode === "listening" || mode === "working") {
        if (!next || next === "idle" || next === "hidden" || next === "result" || next === "error") return;
      }
      if (next === "error" && !armed) {
        mode = "idle";
        play("error");
        paint();
        return;
      }
      if (next === "result" || next === "listening" || next === "working") return;
      if (mode !== "idle" && !armed) {
        mode = "idle";
        paint();
      }
    }

    function applyCleanupConfig(config) {
      cleanupEnabled = config.dictationCleanupEnabled === true;
      cleanupMode = cleanupEnabled && ["fillers", "polished"].includes(config.dictationCleanupMode) ? config.dictationCleanupMode : "raw";
      textModelReady = Boolean(config.textModelReady);
      if (!cleanupEnabled) menuOpen = false;
    }
    function openCleanupMenu() {
      clearTimeout(cleanupCloseTimer);
      if (!cleanupEnabled || mode !== "idle") return;
      near = true;
      if (!menuOpen) { menuOpen = true; paint(); }
    }
    function closeCleanupSoon() {
      clearTimeout(cleanupCloseTimer);
      cleanupCloseTimer = setTimeout(() => {
        menuOpen = false;
        paint();
      }, 220);
    }
    cleanupToggle.addEventListener("mouseenter", openCleanupMenu);
    cleanupToggle.addEventListener("focus", openCleanupMenu);
    cleanupToggle.addEventListener("mouseleave", closeCleanupSoon);
    menu.addEventListener("mouseenter", () => clearTimeout(cleanupCloseTimer));
    menu.addEventListener("mouseleave", closeCleanupSoon);
    cleanupToggle.addEventListener("click", event => {
      event.stopPropagation();
      openCleanupMenu();
    });
    menu.addEventListener("click", async event => {
      clearTimeout(cleanupCloseTimer);
      const button = event.target.closest("[data-cleanup-mode]");
      if (!button || button.disabled || !window.openflow) return;
      event.stopPropagation();
      try {
        const settings = await window.openflow.dispatch("settings.save", { dictationCleanupMode: button.dataset.cleanupMode });
        applyCleanupConfig(settings.settings || settings);
      } catch {
        play("error");
      }
      // Keep the radio menu open for selection; hover-out and Escape close it.
      // This also preserves the pointer's menu hit area during the save.
      paint();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && menuOpen) { menuOpen = false; paint(); }
      if (menuOpen && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
        event.preventDefault();
        const buttons = [...menu.querySelectorAll("button:not(:disabled)")];
        const current = buttons.indexOf(document.activeElement);
        buttons[(current + (event.key === "ArrowDown" ? 1 : buttons.length - 1) + buttons.length) % buttons.length]?.focus();
      }
    });
    document.addEventListener("click", event => {
      if (menuOpen && !menu.contains(event.target) && !cleanupToggle.contains(event.target)) { menuOpen = false; paint(); }
    });
    mic.addEventListener("click", (event) => {
      event.stopPropagation();
      if (window.openflow) window.openflow.dispatch("dictate.toggle", { source: "symbol" });
    });
    pill.addEventListener("click", () => {
      if (mode === "listening" && window.openflow) window.openflow.dispatch("dictate.toggle");
    });
    if (window.openflow) {
      window.openflow.on("bar-command", (message) => {
        if (!message) return;
        if (message.type === "config") {
          applyCleanupConfig(message);
          if (message.floatingBubble) floatingBubble = message.floatingBubble;
          if (Array.isArray(message.bubbleElements)) bubbleElements = message.bubbleElements;
          if (typeof message.voiceNoteButton === "boolean") voiceNoteButton = message.voiceNoteButton;
          if (Array.isArray(message.commands)) commandsList = message.commands;
          applyBubbleConfig();
        }
        if (message.type === "start") {
          fromSymbol = message.source === "symbol";
          voiceNext = message.source === "voicenote";
          start();
        }
        if (message.type === "stop") {
          if (message.source === "symbol") fromSymbol = true;
          else if (message.source === "chord" || message.source === "toggle") fromSymbol = false;
          stop();
        }
        if (message.type === "toggle") {
          if (armed) stop();
          else start();
        }
        if (message.type === "near" && mode === "idle") {
          near = true;
          paint();
        }
        if (message.type === "far" && !armed && mode === "idle") {
          near = false;
          menuOpen = false;
          paint();
        }
      });
    }
    function setVoiceOpen(value) {
      clearTimeout(voiceCloseTimer);
      pill.classList.toggle("voice-open", Boolean(value));
    }
    function openVoice() {
      if (mode !== "idle" || !near || !voiceNoteButton) return;
      setVoiceOpen(true);
    }
    function closeVoiceSoon() {
      clearTimeout(voiceCloseTimer);
      voiceCloseTimer = setTimeout(() => setVoiceOpen(false), 260);
    }
    [mic, vnote, vtrack].forEach((element) => {
      element.addEventListener("mouseenter", openVoice);
      element.addEventListener("mouseleave", closeVoiceSoon);
    });
    vnote.addEventListener("click", (event) => {
      event.stopPropagation();
      setVoiceOpen(false);
      if (window.openflow) window.openflow.dispatch("voicenote.start");
    });
    shot.addEventListener("click", (event) => {
      event.stopPropagation();
      if (window.openflow) window.openflow.dispatch("shot.open");
    });
    note.addEventListener("click", (event) => {
      event.stopPropagation();
      if (window.openflow) window.openflow.dispatch("note.open");
    });
    tune.addEventListener("click", (event) => {
      event.stopPropagation();
      if (window.openflow) window.openflow.dispatch("desk.open");
    });
    grip.addEventListener("click", () => {
      near = true;
      paint();
    });

    if (window.openflow) {
      window.openflow.dispatch("settings.get").then((s) => {
        if (!s) return;
        applyCleanupConfig(s);
        if (s.floatingBubble) floatingBubble = s.floatingBubble;
        if (Array.isArray(s.bubbleElements)) bubbleElements = s.bubbleElements;
        if (typeof s.voiceNoteButton === "boolean") voiceNoteButton = s.voiceNoteButton;
        if (Array.isArray(s.commands)) commandsList = s.commands;
        applyBubbleConfig();
      }).catch(() => {});
      window.openflow.on("overlay-state", applyState);
      paint();
    } else {
      paint();
    }
  </script>
</body>
</html>

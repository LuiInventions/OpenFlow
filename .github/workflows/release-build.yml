name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:settings
      - run: npm run dist
      - run: npm run dist:local -- --prepackaged=release/win-unpacked
      - run: node scripts/verify-package.cjs release/win-unpacked
      - run: node scripts/prepare-release.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenFlow-Windows-release
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
